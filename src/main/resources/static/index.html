<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaC: Board Only</title>
    <style>
        :root {
            --bg-color: #0f172a;       /* Slate 900 */
            --panel-bg: #1e293b;       /* Slate 800 */
            --panel-border: #334155;   /* Slate 700 */
            --text-main: #f8fafc;      /* Slate 50 */
            --text-muted: #94a3b8;     /* Slate 400 */
            --p1-color: #3b82f6;       /* Blue */
            --p2-color: #ef4444;       /* Red */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* The Main Battlefield Container */
        .battlefield {
            display: flex;
            align-items: center;
            gap: 40px; /* The gap in the middle */
            padding: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Individual Player Boards (5 rows, 2 columns) */
        .player-board {
            display: grid;
            grid-template-columns: repeat(2, 80px); /* 2 columns, 80px wide */
            grid-template-rows: repeat(5, 80px);    /* 5 rows, 80px tall */
            gap: 10px;
        }

        /* Position Boxes */
        .pos-box {
            background: var(--bg-color);
            border: 2px solid var(--panel-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        /* Number labels inside the box */
        .pos-num {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        /* Player-specific accent colors */
        .left-board .pos-box { border-color: rgba(59, 130, 246, 0.3); }
        .right-board .pos-box { border-color: rgba(239, 68, 68, 0.3); }

        .left-board .pos-box:hover { border-color: var(--p1-color); box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }
        .right-board .pos-box:hover { border-color: var(--p2-color); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }

        /* Middle Divider Line */
        .divider {
            width: 2px;
            height: 400px;
            background: linear-gradient(to bottom, transparent, var(--panel-border), transparent);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .divider span {
            background: var(--panel-bg);
            padding: 10px;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 2px;
            writing-mode: vertical-rl;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="battlefield">

    <div class="player-board left-board">
        <div class="pos-box" id="p1-1"><span class="pos-num">1</span>[ ]</div>
        <div class="pos-box" id="p1-2"><span class="pos-num">2</span>[ ]</div>
        <div class="pos-box" id="p1-3"><span class="pos-num">3</span>[ ]</div>
        <div class="pos-box" id="p1-4"><span class="pos-num">4</span>[ ]</div>
        <div class="pos-box" id="p1-5"><span class="pos-num">5</span>[ ]</div>
        <div class="pos-box" id="p1-6"><span class="pos-num">6</span>[ ]</div>
        <div class="pos-box" id="p1-7"><span class="pos-num">7</span>[ ]</div>
        <div class="pos-box" id="p1-8"><span class="pos-num">8</span>[ ]</div>
        <div class="pos-box" id="p1-9"><span class="pos-num">9</span>[ ]</div>
        <div class="pos-box" id="p1-10"><span class="pos-num">10</span>[ ]</div>
    </div>

    <div class="divider">
        <span>Arena</span>
    </div>

    <div class="player-board right-board">
        <div class="pos-box" id="p2-1"><span class="pos-num">1</span>[ ]</div>
        <div class="pos-box" id="p2-2"><span class="pos-num">2</span>[ ]</div>
        <div class="pos-box" id="p2-3"><span class="pos-num">3</span>[ ]</div>
        <div class="pos-box" id="p2-4"><span class="pos-num">4</span>[ ]</div>
        <div class="pos-box" id="p2-5"><span class="pos-num">5</span>[ ]</div>
        <div class="pos-box" id="p2-6"><span class="pos-num">6</span>[ ]</div>
        <div class="pos-box" id="p2-7"><span class="pos-num">7</span>[ ]</div>
        <div class="pos-box" id="p2-8"><span class="pos-num">8</span>[ ]</div>
        <div class="pos-box" id="p2-9"><span class="pos-num">9</span>[ ]</div>
        <div class="pos-box" id="p2-10"><span class="pos-num">10</span>[ ]</div>
    </div>

</div>

</body>
</html>
