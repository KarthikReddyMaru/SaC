<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaC: Tactical Command HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        zinc: { 850: '#202024', 950: '#09090b' }
                    }
                }
            }
        }
    </script>

    <style>
        /* Minimalist Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* Dice Shaking Animation */
        .rolling { animation: shake 0.15s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-1px, -2px) rotate(-2deg); }
            50% { transform: translate(-3px, 0px) rotate(2deg); }
            75% { transform: translate(3px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -1px) rotate(1deg); }
        }
    </style>
</head>

<body class="bg-zinc-950 text-zinc-100 font-sans h-screen overflow-hidden selection:bg-blue-500/30 relative">

<div id="toast-container" class="fixed bottom-6 left-6 z-50 flex flex-col-reverse items-start gap-2 pointer-events-none"></div>

<div id="login-screen" class="absolute inset-0 z-50 flex items-center justify-center p-4 bg-zinc-950">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 max-w-sm w-full shadow-[0_0_50px_rgba(0,0,0,0.5)] flex flex-col gap-6">

        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold tracking-widest text-zinc-100 uppercase">SaC Arena</h1>
            <p class="text-xs text-zinc-500 tracking-widest uppercase">Tactical Command</p>
        </div>

        <div id="online-badge" class="hidden bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-bold px-3 py-1.5 rounded-full w-fit mx-auto flex items-center gap-2 shadow-inner uppercase tracking-wider">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
            <span id="online-count">0</span> Warriors Online
        </div>

        <div class="flex flex-col gap-4 mt-2">
            <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-1.5 ml-1">Callsign (Username)</label>
                <input type="text" id="input-username" placeholder="e.g. son" class="w-full bg-zinc-950 border border-zinc-800 text-zinc-200 text-sm px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 transition-colors placeholder:text-zinc-700 shadow-inner">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-1.5 ml-1">Battlefield (Room ID)</label>
                <input type="text" id="input-room" placeholder="e.g. room123" class="w-full bg-zinc-950 border border-zinc-800 text-zinc-200 text-sm px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 transition-colors placeholder:text-zinc-700 shadow-inner">
            </div>
        </div>

        <button onclick="connectToServer()" class="mt-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-4 py-3.5 rounded-xl transition-all active:scale-95 shadow-lg w-full tracking-wide uppercase">
            Establish Uplink
        </button>

    </div>
</div>

<div id="game-over-overlay" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 max-w-sm w-full text-center shadow-[0_0_50px_rgba(0,0,0,0.8)]">
        <h2 class="text-3xl font-bold text-amber-500 mb-2 uppercase tracking-widest">GAME OVER</h2>
        <p id="winner-text" class="text-lg text-zinc-300 mb-6 font-mono"></p>
        <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition w-full">Return to Headquarters</button>
    </div>
</div>

<div id="game-ui" class="hidden h-full flex-col p-2 md:p-4 gap-4">

    <header class="flex-shrink-0 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 flex flex-wrap justify-between items-center gap-3 shadow-lg z-10">
        <div class="flex flex-wrap items-center gap-2 md:gap-4">
            <div class="bg-zinc-950 border border-zinc-800 px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-400 shadow-inner">
                ROOM <span id="hud-room" class="text-zinc-100 ml-1">???</span>
            </div>
            <div class="bg-zinc-950 border border-zinc-800 px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-400 shadow-inner">
                MODE <span id="hud-mode" class="text-zinc-100 ml-1">???</span>
            </div>

            <div class="flex flex-wrap gap-2 ml-2 md:ml-4">
                <button onclick="injectDummyData()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 font-medium text-xs px-3 py-1.5 rounded-md transition-colors shadow-sm hidden md:block">Load Mock</button>

                <div class="hidden xl:flex gap-2">
                    <button onclick="sendActionPayload('PROMOTE', null, null, null, null, 'VETERAN')" class="bg-purple-900/40 hover:bg-purple-800/80 text-purple-400 border border-purple-800/30 font-medium text-[10px] px-2 py-1.5 rounded-md transition-colors shadow-sm">Test Promote</button>
                    <button onclick="sendActionPayload('CAPTURE', 1, null, 'opponentMock', null)" class="bg-red-900/40 hover:bg-red-800/80 text-red-400 border border-red-800/30 font-medium text-[10px] px-2 py-1.5 rounded-md transition-colors shadow-sm">Test Capture</button>
                </div>

                <button id="btn-guide" onclick="toggleGuide()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-400 border border-zinc-700 font-medium text-xs px-3 py-1.5 rounded-md transition-all duration-300 shadow-sm ml-2">Guide: OFF</button>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2 md:gap-4">
            <div class="bg-zinc-950 border border-zinc-800 px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-400 shadow-inner">
                TURN <span id="hud-turn" class="text-blue-400 ml-1">???</span>
            </div>
            <div id="hud-status" class="bg-zinc-950 border border-zinc-800 px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-500 shadow-inner transition-colors duration-300">
                STATUS: WAITING...
            </div>

            <button onclick="disconnectUplink()" class="bg-red-900/50 hover:bg-red-800 text-red-300 border border-red-800/50 font-medium text-xs px-3 py-1.5 rounded-md transition-colors shadow-sm ml-2">Abort Uplink</button>
        </div>
    </header>

    <div class="flex-1 flex flex-col lg:flex-row gap-4 min-h-0">

        <main class="flex-1 min-w-0 bg-zinc-900/40 border border-zinc-800 rounded-xl flex flex-col shadow-[inset_0_0_50px_rgba(0,0,0,0.2)] overflow-hidden">
            <div class="flex-1 overflow-x-auto overflow-y-auto flex justify-center items-center p-4">
                <div class="flex items-stretch gap-4 md:gap-8 min-w-max py-4">

                    <div class="flex flex-col gap-4">
                        <div class="flex justify-between items-center px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg shadow-sm">
                            <span id="p1-name" class="text-sm font-semibold text-blue-400">Waiting...</span>
                            <span id="p1-score" class="font-mono text-xs text-zinc-300 bg-zinc-950 px-2 py-1 rounded border border-zinc-800 shadow-inner">0 PTS</span>
                        </div>
                        <div id="p1-grid" class="grid grid-cols-2 gap-2.5"></div>
                    </div>

                    <div class="flex flex-col w-44 md:w-60 justify-center h-full my-auto">
                        <div class="flex items-center w-full mb-6">
                            <div class="flex-1 h-[1px] bg-gradient-to-r from-transparent to-zinc-700"></div>
                            <span class="px-3 text-[10px] font-bold tracking-[0.25em] text-zinc-500 uppercase">Arena</span>
                            <div class="flex-1 h-[1px] bg-gradient-to-l from-transparent to-zinc-700"></div>
                        </div>

                        <div id="dynamic-action-area" class="w-full bg-zinc-950/80 border border-dashed border-zinc-700 rounded-xl flex flex-col justify-center items-center text-center p-4 shadow-inner min-h-[140px]">
                            <svg class="w-6 h-6 text-zinc-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke-width="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"></circle>
                                <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"></circle>
                            </svg>
                            <span class="text-xs text-zinc-500 font-medium leading-relaxed">Awaiting Connection...</span>
                        </div>
                    </div>

                    <div class="flex flex-col gap-4">
                        <div class="flex justify-between items-center px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg shadow-sm">
                            <span id="p2-score" class="font-mono text-xs text-zinc-300 bg-zinc-950 px-2 py-1 rounded border border-zinc-800 shadow-inner">0 PTS</span>
                            <span id="p2-name" class="text-sm font-semibold text-red-400">Waiting...</span>
                        </div>
                        <div id="p2-grid" class="grid grid-cols-2 gap-2.5"></div>
                    </div>

                </div>
            </div>

            <div id="guide-panel" style="display: none;" class="w-full bg-zinc-950/80 border-t border-zinc-800 p-3 md:p-4 text-center transition-opacity duration-300 shadow-[0_-4px_15px_rgba(0,0,0,0.3)] mt-auto">
                <div class="max-w-3xl mx-auto flex flex-col md:flex-row items-center gap-3 md:gap-4">
                    <div class="bg-blue-500/10 border border-blue-500/30 px-3 py-1.5 rounded-lg flex-shrink-0 shadow-inner">
                        <span class="text-[10px] uppercase tracking-[0.1em] text-blue-400 font-bold">Commander's Guide</span>
                    </div>
                    <p id="guide-text" class="text-xs md:text-sm text-zinc-300 leading-relaxed text-left">
                        Awaiting game initialization. Connect to a room to begin.
                    </p>
                </div>
            </div>

        </main>

        <aside class="w-full lg:w-72 xl:w-80 flex-shrink-0 bg-zinc-900 border border-zinc-800 rounded-xl flex flex-col shadow-lg overflow-hidden h-[300px] lg:h-full">
            <div class="px-4 py-3 bg-zinc-900 border-b border-zinc-800 text-[10px] font-bold tracking-[0.2em] text-zinc-500 uppercase">
                Comm-Link
            </div>
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3 relative">
                <div id="chat-empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-zinc-600 opacity-50 pointer-events-none">
                    <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    <span class="text-xs font-medium uppercase tracking-widest">Awaiting Transmissions</span>
                </div>
            </div>
            <div class="p-3 bg-zinc-950/50 border-t border-zinc-800 flex gap-2">
                <input type="text" id="chat-input" onkeypress="if(event.key === 'Enter') sendChatMessage()" placeholder="Message..." class="flex-1 bg-zinc-900 border border-zinc-700 text-zinc-200 text-xs px-3 py-2 rounded-lg focus:outline-none focus:border-blue-500 transition-colors shadow-inner placeholder:text-zinc-600">
                <button onclick="sendChatMessage()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 rounded-lg transition-colors shadow-sm flex justify-center items-center active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </aside>

    </div>
</div>

<script>
    // Global State Variables
    let ws;
    let isGuideEnabled = false;
    let guideIdleTimer = null;

    // Toast Sync Buffers
    let pendingToasts = [];

    // SECURE IDENTITY MANAGER
    const IdentityManager = (() => {
        let _clientId = localStorage.getItem('sac_client_id');
        if (!_clientId) {
            _clientId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).substring(2);
            localStorage.setItem('sac_client_id', _clientId);
        }

        return {
            setUsername: (name) => { localStorage.setItem('sac_username', name); },
            getUsername: () => { return localStorage.getItem('sac_username') || ""; },
            setRoomId: (room) => { localStorage.setItem('sac_room_id', room); },
            getRoomId: () => { return localStorage.getItem('sac_room_id') || ""; },
            getClientId: () => _clientId,
            clearSession: () => {
                localStorage.removeItem('sac_username');
                localStorage.removeItem('sac_room_id');
            }
        };
    })();

    // The Single Source of Truth
    let globalGameState = null;

    // Animation Sync Buffers
    let isAnimatingRoll = false;
    let pendingGameState = null;

    // Transient Targeting Flags
    let isWildcardSelecting = false;
    let isRevertSelecting = false;
    let isCaptureSelecting = false;
    let isBlackOutSelecting = false;

    /**
     * 1. INITIALIZATION ON LOAD
     */
    window.onload = () => {
        const emptyPositions = Array(11).fill(null);
        renderGrid('p1-grid', emptyPositions, 'p1');
        renderGrid('p2-grid', emptyPositions, 'p2');
        fetchOnlinePlayers();

        // Check for active session and Auto-Reconnect
        const savedUser = IdentityManager.getUsername();
        const savedRoom = IdentityManager.getRoomId();

        if (savedUser && savedRoom) {
            document.getElementById('input-username').value = savedUser;
            document.getElementById('input-room').value = savedRoom;
            showToast("info", "Recovering Active Session...");
            connectToServer();
        }
    };

    function fetchOnlinePlayers() {
        fetch('/online/players')
            .then(response => response.text())
            .then(count => {
                if (count && !isNaN(count)) {
                    document.getElementById('online-count').innerText = count;
                    document.getElementById('online-badge').classList.remove('hidden');
                }
            })
            .catch(err => console.warn("MetadataController not reachable:", err));
    }

    /**
     * 2. CONNECT / DISCONNECT LOGIC
     */
    function connectToServer() {
        const user = document.getElementById('input-username').value.trim();
        const room = document.getElementById('input-room').value.trim();

        if (!user || !room) {
            alert("Both Callsign and Battlefield ID are required.");
            return;
        }

        IdentityManager.setUsername(user);
        IdentityManager.setRoomId(room);

        let wsHost = window.location.host;
        if (!wsHost) wsHost = 'localhost:80';

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${wsHost}/ws/room?roomId=${encodeURIComponent(IdentityManager.getRoomId())}&username=${encodeURIComponent(IdentityManager.getUsername())}&clientId=${encodeURIComponent(IdentityManager.getClientId())}`;

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('game-ui').classList.add('flex');

            document.getElementById('hud-room').innerText = IdentityManager.getRoomId();
            document.getElementById('p1-name').innerText = IdentityManager.getUsername() + " (You)";

            // HOLD PATTERN UI
            const statusEl = document.getElementById('hud-status');
            statusEl.innerText = "STATUS: AWAITING OPPONENT";
            statusEl.classList.remove('text-zinc-500');
            statusEl.classList.add('text-amber-500', 'animate-pulse');

            showToast("success", "Uplink Established. Connected to Server.");
            updateGuide("Connection secure. The tactical grid will remain locked until the opponent joins the battlefield.");

            const actionArea = document.getElementById('dynamic-action-area');
            actionArea.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center gap-3">
                    <div class="relative w-8 h-8">
                        <div class="absolute inset-0 rounded-full border-[3px] border-zinc-800"></div>
                        <div class="absolute inset-0 rounded-full border-[3px] border-t-amber-500 animate-spin"></div>
                    </div>
                    <div class="flex flex-col gap-1">
                        <span class="text-xs text-amber-500 font-bold uppercase tracking-widest animate-pulse">Hold</span>
                        <span class="text-[10px] text-zinc-500 uppercase tracking-wide">Awaiting Enemy Connection...</span>
                    </div>
                </div>
            `;
        };

        ws.onmessage = (event) => {
            try {
                let msg = JSON.parse(event.data);

                if (typeof msg.content === 'string' && msg.content.startsWith('{')) {
                    try { msg.content = JSON.parse(msg.content); } catch (e) {}
                }

                switch (msg.type) {
                    case "STATE":
                    case "FINISH":
                        if (isAnimatingRoll) {
                            pendingGameState = msg.content;
                        } else {
                            globalGameState = msg.content;
                            updateGameState(msg.content);
                            if (globalGameState.gameplayStatus === 'FINISHED') {
                                showGameOverScreen(globalGameState);
                            }
                        }
                        break;
                    case "INFO":
                        if (isAnimatingRoll) pendingToasts.push({ type: "info", text: msg.content });
                        else showToast("info", msg.content);
                        break;
                    case "ERROR":
                        if (isAnimatingRoll) pendingToasts.push({ type: "error", text: msg.content });
                        else showToast("error", msg.content);
                        break;
                    case "MESSAGE":
                        appendChatLog(msg.sender, msg.content);
                        break;
                    case "ROLL_RESULT":
                        handleRollResultFromServer(msg.content);
                        break;
                }
            } catch (e) {
                console.error("Message Parsing Error:", e);
            }
        };

        ws.onclose = () => {
            showToast("error", "Connection to Server Lost.");
            updateGuide("Connection severed. Please refresh to reconnect.");
        };
    }

    function disconnectUplink() {
        if (ws) {
            ws.onclose = null;
            ws.close();
        }
        IdentityManager.clearSession();
        location.reload();
    }


    // ========================================================
    // IDLE NUDGE LOGIC
    // ========================================================

    function manageGuideIdleNudge() {
        clearTimeout(guideIdleTimer);

        const btn = document.getElementById('btn-guide');
        btn.classList.remove('ring-4', 'ring-emerald-500', 'shadow-[0_0_15px_rgba(16,185,129,0.8)]', 'animate-pulse');

        if (!isGuideEnabled && globalGameState && globalGameState.currentPlayerId === IdentityManager.getClientId() && globalGameState.gameplayStatus !== 'OFFLINE') {
            guideIdleTimer = setTimeout(() => {
                if (!isGuideEnabled && globalGameState.currentPlayerId === IdentityManager.getClientId()) {
                    btn.classList.add('ring-4', 'ring-emerald-500', 'shadow-[0_0_15px_rgba(16,185,129,0.8)]', 'animate-pulse');
                    showToast("info", "Commander, tactical guide is available if you need assistance.");
                }
            }, 10000);
        }
    }


    // ========================================================
    // STATE ENGINE & RENDERING LOGIC
    // ========================================================

    function updateGameState(gameState) {
        try {
            // 1. Wipe targeting flags
            isWildcardSelecting = false;
            isRevertSelecting = false;
            isCaptureSelecting = false;
            isBlackOutSelecting = false;

            // 2. Update HUD
            document.getElementById('hud-mode').innerText = gameState.gameMode ? gameState.gameMode.replace('_', ' ') : '???';

            const turnEl = document.getElementById('hud-turn');
            if (turnEl) {
                if (gameState.currentPlayerId === IdentityManager.getClientId()) {
                    turnEl.innerText = "You";
                } else {
                    const currentP = gameState.players.find(p => p.clientId === gameState.currentPlayerId);
                    turnEl.innerText = currentP ? currentP.username : gameState.currentPlayerId;
                }
            }

            const statusEl = document.getElementById('hud-status');
            if (statusEl) {
                statusEl.className = "bg-zinc-950 border border-zinc-800 px-3 py-1.5 rounded-md text-xs font-semibold shadow-inner transition-colors duration-300";

                if (gameState.gameplayStatus === 'OFFLINE') {
                    statusEl.classList.add('text-red-500', 'animate-pulse', 'border-red-800/50', 'bg-red-950/20');
                    statusEl.innerText = "STATUS: OPPONENT OFFLINE";
                } else if (gameState.state === 'ACTION_REQUIRED') {
                    statusEl.classList.add('text-zinc-500');
                    statusEl.innerText = `STATUS: Action Pending (Pos ${gameState.actionPendingOn})`;
                } else {
                    statusEl.classList.add('text-zinc-500');
                    statusEl.innerText = `STATUS: ${gameState.state || gameState.positionSelection || 'WAITING'}`;
                }
            }

            // 3. Render Grids
            const p1 = gameState.players.find(p => p.clientId === IdentityManager.getClientId());
            const p2 = gameState.players.find(p => p.clientId !== IdentityManager.getClientId());

            if (p1) {
                document.getElementById('p1-score').innerText = p1.points + " PTS";
                renderGrid('p1-grid', p1.positions, 'p1');
            }
            if (p2) {
                document.getElementById('p2-name').innerText = p2.username;
                document.getElementById('p2-score').innerText = p2.points + " PTS";
                renderGrid('p2-grid', p2.positions, 'p2');
            }

            if (gameState.gameplayStatus === 'FINISHED') return;

            // 4. Action Area State Routing

            // Check for Offline
            if (gameState.gameplayStatus === 'OFFLINE') {
                const actionArea = document.getElementById('dynamic-action-area');
                actionArea.innerHTML = `
                    <div class="flex flex-col items-center justify-center text-center gap-3">
                        <svg class="w-8 h-8 text-red-500/80 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3"></path>
                        </svg>
                        <div class="flex flex-col gap-1">
                            <span class="text-xs text-red-500 font-bold uppercase tracking-widest animate-pulse">Signal Lost</span>
                            <span class="text-[10px] text-zinc-500 uppercase tracking-wide">Awaiting Enemy Recon...</span>
                        </div>
                    </div>
                `;
                updateGuide("WARNING: Enemy signal lost. Grid operations suspended until reconnection.");
            }
            // Check for Stateless Wildcard Recovery
            else if (gameState.isWildcard || gameState.wildcardActive) {
                if (gameState.currentPlayerId === IdentityManager.getClientId()) {
                    triggerWildcardSelection();
                } else {
                    resetActionArea("Opponent triggered a WILDCARD. Waiting for selection...");
                }
            }
            else if (gameState.state === 'ROLL') {
                renderRollUI(gameState.currentPlayerId === IdentityManager.getClientId());
            }
            else if (gameState.state === 'ACTION_REQUIRED') {
                if (gameState.currentPlayerId === IdentityManager.getClientId()) {
                    renderActionUI(gameState.actionPendingOnActor);
                } else {
                    resetActionArea(`Waiting for opponent to execute action...`);

                    let actorStr = gameState.actionPendingOnActor ? ` using their ${gameState.actionPendingOnActor}` : "";
                    const oppP = gameState.players.find(p => p.clientId === gameState.currentPlayerId);
                    const oppName = oppP ? oppP.username : 'Opponent';

                    updateGuide(`Enemy maneuvering: ${oppName} is executing a tactical action on Position ${gameState.actionPendingOn}${actorStr}. Stand by.`);
                }
            }
            else {
                if (gameState.currentPlayerId === IdentityManager.getClientId()) {
                    resetActionArea("Awaiting your next directive...");
                    updateGuide("Your turn. Assess the battlefield.");
                } else {
                    resetActionArea("Waiting for opponent's move...");
                    const oppP = gameState.players.find(p => p.clientId === gameState.currentPlayerId);
                    const oppName = oppP ? oppP.username : 'Opponent';
                    updateGuide(`It is ${oppName}'s turn. Stand by.`);
                }
            }

            manageGuideIdleNudge();

        } catch (e) {
            console.error("Error in updateGameState:", e);
        }
    }

    function handleBoxClick(gridId, posId) {
        if (!globalGameState || globalGameState.gameplayStatus === 'OFFLINE') {
            showToast("info", "Grid locked. Awaiting enemy connection.");
            return;
        }

        const myClientId = IdentityManager.getClientId();
        const opponent = globalGameState.players.find(p => p.clientId !== myClientId);
        const opponentClientId = opponent ? opponent.clientId : null;

        if (isWildcardSelecting && gridId === 'p1') {
            const p1 = globalGameState.players.find(p => p.clientId === myClientId);
            const pos = p1.positions.find(p => p.positionId === posId);

            if (pos && !pos.capturedByOpponent) {
                isWildcardSelecting = false;
                ws.send(JSON.stringify({ type: "POSITION", payload: { position: posId } }));
                if (globalGameState) updateGameState(globalGameState);
            }
        }
        else if (isRevertSelecting) {
            if (gridId === 'p1') {
                if (posId === globalGameState.actionPendingOn) {
                    showToast("error", "Cannot Revert the active unit.");
                    return;
                }
                sendActionPayload('REVERT', null, posId, null, myClientId);
            }
            else if (gridId === 'p2') {
                sendActionPayload('REVERT', posId, null, opponentClientId, null);
            }
        }
        else if (isCaptureSelecting && gridId === 'p2') {
            const pos = opponent.positions.find(p => p.positionId === posId);

            if (pos && !pos.capturedByOpponent) {
                sendActionPayload('CAPTURE', posId, null, opponentClientId, null);
            }
        }
        else if (isBlackOutSelecting && gridId === 'p2') {
            const pos = opponent.positions.find(p => p.positionId === posId);

            if (pos && !pos.capturedByOpponent && pos.actor) {
                sendActionPayload('BLACKOUT', posId, null, opponentClientId, null);
            } else {
                showToast("error", "BlackOut requires targeting an active enemy actor.");
            }
        }
    }

    function requestRollFromServer() {
        const btn = document.getElementById('btn-roll');

    function handleRollResultFromServer(rollData) {
        const btn = document.getElementById('btn-roll');
        if(btn) btn.innerText = "ROLLING...";

        let v1 = rollData.diceResults[0] === 0 ? '' : String(rollData.diceResults[0]);
        let v2 = rollData.diceResults[1] === 0 ? '' : String(rollData.diceResults[1]);

        if (rollData.isWildcard) {
            v1 = ''; v2 = '';
        }

        executeRollAnimation(v1, v2, rollData.isWildcard);
    }

    function executeRollAnimation(finalVal1, finalVal2, isWildcard) {
        isAnimatingRoll = true;
        clearTimeout(guideIdleTimer);

        const d1 = document.getElementById('die-1');
        const d2 = document.getElementById('die-2');
        if(!d1 || !d2) {
            isAnimatingRoll = false;
            return;
        }

        const d1Text = d1.querySelector('span');
        const d2Text = d2.querySelector('span');
        const btn = document.getElementById('btn-roll');

        d1.classList.add('rolling');
        d2.classList.add('rolling');

        const faces = ['1', '2', '3', '4', '5', ''];
        let rolls = 0;

        const interval = setInterval(() => {
            d1Text.innerText = faces[Math.floor(Math.random() * faces.length)];
            d2Text.innerText = faces[Math.floor(Math.random() * faces.length)];
            rolls++;

            if(rolls > 25) {
                clearInterval(interval);
                d1.classList.remove('rolling');
                d2.classList.remove('rolling');

                d1Text.innerText = finalVal1;
                d2Text.innerText = finalVal2;

                if (isWildcard && btn) {
                    btn.innerText = "WILDCARD!";
                    btn.classList.replace('bg-blue-600', 'bg-amber-600');
                    btn.classList.replace('hover:bg-blue-500', 'hover:bg-amber-500');
                } else if (btn) {
                    let val1 = finalVal1 === '' ? 0 : parseInt(finalVal1);
                    let val2 = finalVal2 === '' ? 0 : parseInt(finalVal2);
                    let sum = val1 + val2;

                    btn.innerText = "ROLLED: " + sum;
                    btn.classList.replace('bg-blue-600', 'bg-emerald-600');
                    btn.classList.replace('hover:bg-blue-500', 'hover:bg-emerald-500');
                }

                setTimeout(() => {
                    isAnimatingRoll = false;

                    const hadPendingState = (pendingGameState !== null);

                    if (hadPendingState) {
                        globalGameState = pendingGameState;
                        updateGameState(pendingGameState);
                        pendingGameState = null;

                        if (globalGameState.gameplayStatus === 'FINISHED') {
                            showGameOverScreen(globalGameState);
                        }
                    } else {
                        if (globalGameState) {
                            updateGameState(globalGameState);
                        }
                    }

                    const isMyTurnNow = (globalGameState && globalGameState.currentPlayerId === IdentityManager.getClientId());

                    if (globalGameState.gameplayStatus !== 'OFFLINE') {
                        if (isWildcard) {
                            if (isMyTurnNow) triggerWildcardSelection();
                            else resetActionArea("Opponent triggered a WILDCARD. Waiting for selection...");
                        } else {
                            if (!hadPendingState && isMyTurnNow && globalGameState && globalGameState.state === 'ROLL') {
                                resetActionArea("Analyzing target position...");
                            }
                        }
                    }

                    // Flush any toasts that came in during the animation
                    pendingToasts.forEach(t => showToast(t.type, t.text));
                    pendingToasts = [];

                    manageGuideIdleNudge();

                }, 1000);
            }
        }, 50);
    }

    function sendActionPayload(actionType, targetPosId = null, sourcePosId = null, targetHolder = null, sourceHolder = null, spec = null) {
        let payload = { gameAction: actionType };

        if (targetPosId !== null) payload.destinationPosition = targetPosId;
        if (sourcePosId !== null) payload.sourcePosition = sourcePosId;
        if (targetHolder !== null) payload.destinationPositionHolder = targetHolder;
        if (sourceHolder !== null) payload.sourcePositionHolder = sourceHolder;
        if (spec !== null) payload.specialization = spec;

        isRevertSelecting = false;
        isCaptureSelecting = false;
        isBlackOutSelecting = false;

        ws.send(JSON.stringify({ type: "ACTION", payload: payload }));

        if (globalGameState) {
            updateGameState(globalGameState);
        }
    }

    function resetActionArea(msg = "Awaiting game state...") {
        document.getElementById('dynamic-action-area').innerHTML = `
            <svg class="w-6 h-6 text-zinc-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke-width="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"></circle>
                <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"></circle>
            </svg>
            <span class="text-xs text-zinc-500 font-medium leading-relaxed">${msg}</span>
        `;
    }

    function showToast(type, text) {
        const container = document.getElementById('toast-container');

        // Allow up to 4 toasts to stack before removing oldest
        if (container.children.length >= 4) {
            container.removeChild(container.lastChild); // Remove from the bottom of the reversed flex list
        }

        let colorClass = "bg-zinc-800/90 border-zinc-700 text-zinc-200";
        let iconHtml = '';

        if (type === "error") {
            colorClass = "bg-red-950/90 border-red-800 text-red-300 shadow-[0_0_20px_rgba(220,38,38,0.2)]";
            iconHtml = `<svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`;
        } else if (type === "success") {
            colorClass = "bg-emerald-950/90 border-emerald-800 text-emerald-300 shadow-[0_0_20px_rgba(16,185,129,0.2)]";
            iconHtml = `<svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
        } else {
            colorClass = "bg-zinc-800/90 border-zinc-700 text-zinc-200 shadow-[0_0_20px_rgba(0,0,0,0.4)]";
            iconHtml = `<svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
        }

        const toast = document.createElement('div');
        toast.className = `px-4 py-3 rounded-lg border text-xs font-mono flex items-start gap-3 transition-all duration-300 transform -translate-x-8 opacity-0 ${colorClass} max-w-sm backdrop-blur-md`;

        toast.innerHTML = iconHtml;
        const textNode = document.createElement('span');
        textNode.textContent = text;
        textNode.className = "leading-relaxed break-words";
        toast.appendChild(textNode);

        // Prepend because we are using flex-col-reverse, this makes it pop at the bottom
        container.prepend(toast);

        requestAnimationFrame(() => {
            toast.classList.remove('-translate-x-8', 'opacity-0');
        });

        setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-y-2');
            setTimeout(() => {
                if (container.contains(toast)) {
                    container.removeChild(toast);
                }
            }, 300);
        }, 4000);
    }

    function appendChatLog(sender, text) {
        const emptyState = document.getElementById('chat-empty-state');
        if (emptyState) {
            emptyState.remove();
        }

        const container = document.getElementById('chat-messages');

        const isMe = (sender === IdentityManager.getUsername() || sender === IdentityManager.getClientId() || sender === "You");
        const senderName = isMe ? "You" : sender;

        const alignClass = isMe ? "self-end items-end" : "self-start items-start";
        const colorClass = isMe ? "text-blue-400" : "text-red-400";
        const bgClass = isMe ? "bg-blue-600 text-white border-blue-500" : "bg-zinc-800/50 border-zinc-700/50 text-zinc-200";
        const radiusClass = isMe ? "rounded-tr-sm" : "rounded-tl-sm";

        const wrapper = document.createElement('div');
        wrapper.className = `flex flex-col gap-1 max-w-[85%] ${alignClass}`;

        const senderSpan = document.createElement('span');
        senderSpan.className = `${colorClass} font-semibold text-[10px] uppercase tracking-wide`;
        senderSpan.textContent = senderName;

        const msgDiv = document.createElement('div');
        msgDiv.className = `px-3 py-2 border rounded-xl ${radiusClass} text-xs shadow-sm ${bgClass} whitespace-pre-wrap break-words`;
        msgDiv.textContent = text;

        wrapper.appendChild(senderSpan);
        wrapper.appendChild(msgDiv);
        container.appendChild(wrapper);

        container.scrollTop = container.scrollHeight;
    }

    function toggleGuide() {
        isGuideEnabled = !isGuideEnabled;
        const btn = document.getElementById('btn-guide');
        const panel = document.getElementById('guide-panel');

        btn.classList.remove('ring-4', 'ring-emerald-500', 'shadow-[0_0_15px_rgba(16,185,129,0.8)]', 'animate-pulse');

        if (isGuideEnabled) {
            btn.innerText = "Guide: ON";
            btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs px-3 py-1.5 rounded-md transition-colors shadow-sm ml-2";
            panel.style.display = 'block';
            clearTimeout(guideIdleTimer);
        } else {
            btn.innerText = "Guide: OFF";
            btn.className = "bg-zinc-800 hover:bg-zinc-700 text-zinc-400 border border-zinc-700 font-medium text-xs px-3 py-1.5 rounded-md transition-colors shadow-sm ml-2";
            panel.style.display = 'none';
            if (globalGameState) manageGuideIdleNudge();
        }
    }

    function updateGuide(text) {
        document.getElementById('guide-text').innerText = text;
    }

    function showGameOverScreen(gameState) {
        document.getElementById('game-over-overlay').classList.remove('hidden');
        const winnerText = gameState.winner ? `Winner: ${gameState.winner}` : "Draw / Disconnected";
        document.getElementById('winner-text').innerText = winnerText;

        IdentityManager.clearSession();
    }

    function testSendPosition() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            showToast("error", "Cannot send position payload: WebSocket offline.");
            alert("Please establish uplink first!");
            return;
        }

        const testPos = 1;
        ws.send(JSON.stringify({ type: "POSITION", payload: { position: testPos } }));
        showToast("info", `Debug: Raw Position payload sent (Pos: ${testPos}).`);
    }
