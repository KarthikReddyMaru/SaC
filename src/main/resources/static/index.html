<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaC: Tactical Command HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        zinc: { 850: '#202024', 950: '#09090b' }
                    }
                }
            }
        }
    </script>

    <style>
        /* Minimalist Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* Dice Shaking Animation */
        .rolling { animation: shake 0.15s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-1px, -2px) rotate(-2deg); }
            50% { transform: translate(-3px, 0px) rotate(2deg); }
            75% { transform: translate(3px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -1px) rotate(1deg); }
        }
    </style>
</head>

<body class="bg-zinc-950 text-zinc-100 font-sans h-screen overflow-hidden selection:bg-blue-500/30 relative">

<div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none"></div>

<div id="login-screen" class="absolute inset-0 z-50 flex items-center justify-center p-4 bg-zinc-950">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 max-w-sm w-full shadow-[0_0_50px_rgba(0,0,0,0.5)] flex flex-col gap-6">

        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold tracking-widest text-zinc-100 uppercase">SaC Arena</h1>
            <p class="text-xs text-zinc-500 tracking-widest uppercase">Tactical Command</p>
        </div>

        <div id="online-badge" class="hidden bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-bold px-3 py-1.5 rounded-full w-fit mx-auto flex items-center gap-2 shadow-inner uppercase tracking-wider">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
            <span id="online-count">0</span> Warriors Online
        </div>

        <div class="flex flex-col gap-4 mt-2">
            <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-1.5 ml-1">Callsign (Username)</label>
                <input type="text" id="input-username" placeholder="e.g. son" class="w-full bg-zinc-950 border border-zinc-800 text-zinc-200 text-sm px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 transition-colors placeholder:text-zinc-700 shadow-inner">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-1.5 ml-1">Battlefield (Room ID)</label>
                <input type="text" id="input-room" placeholder="e.g. room123" class="w-full bg-zinc-950 border border-zinc-800 text-zinc-200 text-sm px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 transition-colors placeholder:text-zinc-700 shadow-inner">
            </div>
        </div>

        <button onclick="connectToServer()" class="mt-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-4 py-3.5 rounded-xl transition-all active:scale-95 shadow-lg w-full tracking-wide uppercase">
            Establish Uplink
        </button>

    </div>
</div>

<div id="game-over-overlay" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 max-w-sm w-full text-center shadow-[0_0_50px_rgba(0,0,0,0.8)]">
        <h2 class="text-3xl font-bold text-amber-500 mb-2 uppercase tracking-widest">GAME OVER</h2>
        <p id="winner-text" class="text-lg text-zinc-300 mb-6 font-mono"></p>
        <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition w-full">Return to Headquarters</button>
    </div>
</div>

<div id="game-ui" class="hidden h-full flex-col p-2 md:p-4 gap-4">

    <header class="flex-shrink-0 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 flex flex-wrap justify-between items-center gap-3 shadow-lg z-10">
        <div class="flex flex-wrap items-center gap-2 md:gap-4">
            <div class="bg-zinc-950 border border-zinc-800 px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-400 shadow-inner">
                ROOM <span id="hud-room" class="text-zinc-100 ml-1">???</span>
            </div>
            <div class="bg-zinc-950 border border-zinc-800 px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-400 shadow-inner">
                MODE <span id="hud-mode" class="text-zinc-100 ml-1">???</span>
            </div>

            <div class="flex flex-wrap gap-2 ml-2 md:ml-4">
                <button onclick="injectDummyData()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 font-medium text-xs px-3 py-1.5 rounded-md transition-colors shadow-sm">Load Mock State</button>

                <button onclick="sendActionPayload('EVOLVE')" class="bg-purple-900/60 hover:bg-purple-800 text-purple-300 border border-purple-800/50 font-medium text-xs px-3 py-1.5 rounded-md transition-colors shadow-sm">Test Evolve</button>
                <button onclick="sendActionPayload('ATTACK_AND_CAPTURE', 1)" class="bg-red-900/60 hover:bg-red-800 text-red-300 border border-red-800/50 font-medium text-xs px-3 py-1.5 rounded-md transition-colors shadow-sm">Test Attack</button>
                <button onclick="testSendPosition()" class="bg-cyan-900/60 hover:bg-cyan-800 text-cyan-300 border border-cyan-800/50 font-medium text-xs px-3 py-1.5 rounded-md transition-colors shadow-sm">Test Position</button>

                <button id="btn-guide" onclick="toggleGuide()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-400 border border-zinc-700 font-medium text-xs px-3 py-1.5 rounded-md transition-all duration-300 shadow-sm ml-2">Guide: OFF</button>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2 md:gap-4">
            <div class="bg-zinc-950 border border-zinc-800 px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-400 shadow-inner">
                TURN <span id="hud-turn" class="text-blue-400 ml-1">???</span>
            </div>
            <div id="hud-status" class="bg-zinc-950 border border-zinc-800 px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-500 shadow-inner">
                STATUS: Waiting...
            </div>
        </div>
    </header>

    <div class="flex-1 flex flex-col lg:flex-row gap-4 min-h-0">

        <main class="flex-1 min-w-0 bg-zinc-900/40 border border-zinc-800 rounded-xl flex flex-col shadow-[inset_0_0_50px_rgba(0,0,0,0.2)] overflow-hidden">
            <div class="flex-1 overflow-x-auto overflow-y-auto flex justify-center items-center p-4">
                <div class="flex items-stretch gap-4 md:gap-8 min-w-max py-4">

                    <div class="flex flex-col gap-4">
                        <div class="flex justify-between items-center px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg shadow-sm">
                            <span id="p1-name" class="text-sm font-semibold text-blue-400">Waiting...</span>
                            <span id="p1-score" class="font-mono text-xs text-zinc-300 bg-zinc-950 px-2 py-1 rounded border border-zinc-800 shadow-inner">0 PTS</span>
                        </div>
                        <div id="p1-grid" class="grid grid-cols-2 gap-2.5"></div>
                    </div>

                    <div class="flex flex-col w-44 md:w-60 justify-center h-full my-auto">
                        <div class="flex items-center w-full mb-6">
                            <div class="flex-1 h-[1px] bg-gradient-to-r from-transparent to-zinc-700"></div>
                            <span class="px-3 text-[10px] font-bold tracking-[0.25em] text-zinc-500 uppercase">Arena</span>
                            <div class="flex-1 h-[1px] bg-gradient-to-l from-transparent to-zinc-700"></div>
                        </div>

                        <div id="dynamic-action-area" class="w-full bg-zinc-950/80 border border-dashed border-zinc-700 rounded-xl flex flex-col justify-center items-center text-center p-4 shadow-inner min-h-[140px]">
                            <svg class="w-6 h-6 text-zinc-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke-width="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"></circle>
                                <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"></circle>
                            </svg>
                            <span class="text-xs text-zinc-500 font-medium leading-relaxed">Awaiting Connection...</span>
                        </div>
                    </div>

                    <div class="flex flex-col gap-4">
                        <div class="flex justify-between items-center px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg shadow-sm">
                            <span id="p2-score" class="font-mono text-xs text-zinc-300 bg-zinc-950 px-2 py-1 rounded border border-zinc-800 shadow-inner">0 PTS</span>
                            <span id="p2-name" class="text-sm font-semibold text-red-400">Waiting...</span>
                        </div>
                        <div id="p2-grid" class="grid grid-cols-2 gap-2.5"></div>
                    </div>

                </div>
            </div>

            <div id="guide-panel" style="display: none;" class="w-full bg-zinc-950/80 border-t border-zinc-800 p-3 md:p-4 text-center transition-opacity duration-300 shadow-[0_-4px_15px_rgba(0,0,0,0.3)] mt-auto">
                <div class="max-w-3xl mx-auto flex flex-col md:flex-row items-center gap-3 md:gap-4">
                    <div class="bg-blue-500/10 border border-blue-500/30 px-3 py-1.5 rounded-lg flex-shrink-0 shadow-inner">
                        <span class="text-[10px] uppercase tracking-[0.1em] text-blue-400 font-bold">Commander's Guide</span>
                    </div>
                    <p id="guide-text" class="text-xs md:text-sm text-zinc-300 leading-relaxed text-left">
                        Awaiting game initialization. Connect to a room to begin.
                    </p>
                </div>
            </div>

        </main>

        <aside class="w-full lg:w-72 xl:w-80 flex-shrink-0 bg-zinc-900 border border-zinc-800 rounded-xl flex flex-col shadow-lg overflow-hidden h-[300px] lg:h-full">
            <div class="px-4 py-3 bg-zinc-900 border-b border-zinc-800 text-[10px] font-bold tracking-[0.2em] text-zinc-500 uppercase">
                Comm-Link
            </div>
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3">
            </div>
            <div class="p-3 bg-zinc-950/50 border-t border-zinc-800 flex gap-2">
                <input type="text" id="chat-input" onkeypress="if(event.key === 'Enter') sendChatMessage()" placeholder="Message..." class="flex-1 bg-zinc-900 border border-zinc-700 text-zinc-200 text-xs px-3 py-2 rounded-lg focus:outline-none focus:border-blue-500 transition-colors shadow-inner placeholder:text-zinc-600">
                <button onclick="sendChatMessage()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 rounded-lg transition-colors shadow-sm flex justify-center items-center active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </aside>

    </div>
</div>

<script>
    // Global State Variables
    let ws;
    let isGuideEnabled = false; // Default is now OFF
    let guideIdleTimer = null;  // Timer for the Idle Nudge feature

    // SECURE IDENTITY MANAGER (Replaces global myUsername)
    const IdentityManager = (() => {
        let _username = "";
        return {
            set: (name) => {
                if (!_username) _username = name; // Write-once lock
            },
            get: () => _username
        };
    })();

    // The Single Source of Truth
    let globalGameState = null;

    // Animation Sync Buffers
    let isAnimatingRoll = false;
    let pendingGameState = null;

    // Transient Targeting Flags
    let isWildcardSelecting = false;
    let isKamikazeSelecting = false;
    let isAttackSelecting = false;

    /**
     * 1. INITIALIZATION ON LOAD
     */
    window.onload = () => {
        const emptyPositions = Array(11).fill(null);
        renderGrid('p1-grid', emptyPositions, 'p1');
        renderGrid('p2-grid', emptyPositions, 'p2');
        fetchOnlinePlayers();
    };

    function fetchOnlinePlayers() {
        fetch('/online/players')
            .then(response => response.text())
            .then(count => {
                if (count && !isNaN(count)) {
                    document.getElementById('online-count').innerText = count;
                    document.getElementById('online-badge').classList.remove('hidden');
                }
            })
            .catch(err => console.warn("MetadataController not reachable:", err));
    }

    /**
     * 2. CONNECT TO WEBSOCKET
     */
    function connectToServer() {
        const user = document.getElementById('input-username').value.trim();
        const room = document.getElementById('input-room').value.trim();

        if (!user || !room) {
            alert("Both Callsign and Battlefield ID are required.");
            return;
        }

        // Lock in identity
        IdentityManager.set(user);

        let wsHost = window.location.host;
        if (!wsHost) wsHost = 'localhost:80';

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${wsHost}/ws/room?roomId=${room}&username=${IdentityManager.get()}`;

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('game-ui').classList.add('flex');

            document.getElementById('hud-room').innerText = room;
            document.getElementById('p1-name').innerText = IdentityManager.get() + " (You)";

            showToast("success", "Uplink Established. Connected to Server.");
            updateGuide("Connection secure. Awaiting game state from server...");
            resetActionArea("Synchronizing with Server...");
        };

        ws.onmessage = (event) => {
            try {
                let msg = JSON.parse(event.data);

                if (typeof msg.content === 'string' && msg.content.startsWith('{')) {
                    try { msg.content = JSON.parse(msg.content); } catch (e) {}
                }

                switch (msg.type) {
                    case "STATE":
                    case "FINISH":
                        if (isAnimatingRoll) {
                            pendingGameState = msg.content;
                        } else {
                            globalGameState = msg.content;
                            updateGameState(msg.content);
                            if (globalGameState.gameplayStatus === 'FINISHED') {
                                showGameOverScreen(globalGameState);
                            }
                        }
                        break;
                    case "INFO":
                        showToast("info", msg.content);
                        break;
                    case "ERROR":
                        showToast("error", msg.content);
                        break;
                    case "MESSAGE":
                        appendChatLog(msg.sender, msg.content);
                        break;
                    case "ROLL_RESULT":
                        handleRollResultFromServer(msg.content);
                        break;
                }
            } catch (e) {
                console.error("Message Parsing Error:", e);
            }
        };

        ws.onclose = () => {
            showToast("error", "Connection to Server Lost.");
            updateGuide("Connection severed. Please refresh to reconnect.");
        };
    }

    // ========================================================
    // IDLE NUDGE LOGIC
    // ========================================================

    function manageGuideIdleNudge() {
        // Clear any existing timer so it resets
        clearTimeout(guideIdleTimer);

        const btn = document.getElementById('btn-guide');
        // Instantly remove glow if state changes or user makes a move
        btn.classList.remove('ring-4', 'ring-emerald-500', 'shadow-[0_0_15px_rgba(16,185,129,0.8)]', 'animate-pulse');

        // We only want to nudge if the guide is OFF, and it is the USER'S turn.
        if (!isGuideEnabled && globalGameState && globalGameState.currentPlayerId === IdentityManager.get()) {

            // Set timer for 10 seconds of inactivity
            guideIdleTimer = setTimeout(() => {
                // Double check it's still off and still our turn just in case
                if (!isGuideEnabled && globalGameState.currentPlayerId === IdentityManager.get()) {
                    btn.classList.add('ring-4', 'ring-emerald-500', 'shadow-[0_0_15px_rgba(16,185,129,0.8)]', 'animate-pulse');
                    showToast("info", "Commander, tactical guide is available if you need assistance.");
                }
            }, 10000);
        }
    }


    // ========================================================
    // STATE ENGINE & RENDERING LOGIC
    // ========================================================

    function updateGameState(gameState) {
        try {
            // 1. Wipe targeting flags, ensuring clean slate on fresh renders
            isWildcardSelecting = false;
            isKamikazeSelecting = false;
            isAttackSelecting = false;

            // 2. Update HUD
            document.getElementById('hud-mode').innerText = gameState.gameMode ? gameState.gameMode.replace('_', ' ') : '???';
            document.getElementById('hud-turn').innerText = gameState.currentPlayerId === IdentityManager.get() ? "You" : gameState.currentPlayerId;

            const statusEl = document.getElementById('hud-status');
            if (gameState.state === 'ACTION_REQUIRED') {
                statusEl.innerText = `STATUS: Action Pending (Pos ${gameState.actionPendingOn})`;
                statusEl.className = "bg-zinc-950 border border-amber-500/50 px-3 py-1.5 rounded-md text-xs font-semibold text-amber-500 animate-pulse shadow-sm";
            } else {
                statusEl.innerText = `STATUS: ${gameState.state || gameState.positionSelection || 'WAITING'}`;
                statusEl.className = "bg-zinc-950 border border-zinc-800 px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-400 shadow-inner";
            }

            // 3. Render Grids
            const p1 = gameState.players.find(p => p.username === IdentityManager.get());
            const p2 = gameState.players.find(p => p.username !== IdentityManager.get());

            if (p1) {
                document.getElementById('p1-score').innerText = p1.points + " PTS";
                renderGrid('p1-grid', p1.positions, 'p1');
            }
            if (p2) {
                document.getElementById('p2-name').innerText = p2.username;
                document.getElementById('p2-score').innerText = p2.points + " PTS";
                renderGrid('p2-grid', p2.positions, 'p2');
            }

            if (gameState.gameplayStatus === 'FINISHED') return;

            // 4. Action Area State Routing
            if (gameState.state === 'ROLL') {
                renderRollUI(gameState.currentPlayerId === IdentityManager.get());
            }
            else if (gameState.state === 'ACTION_REQUIRED') {
                if (gameState.currentPlayerId === IdentityManager.get()) {
                    renderActionUI(gameState.actionPendingOnActor);
                } else {
                    resetActionArea(`Waiting for ${gameState.currentPlayerId} to execute action...`);

                    let actorStr = gameState.actionPendingOnActor ? ` using their ${gameState.actionPendingOnActor}` : "";
                    updateGuide(`Enemy maneuvering: ${gameState.currentPlayerId} is executing a tactical action on Position ${gameState.actionPendingOn}${actorStr}. Stand by.`);
                }
            }
            else {
                if (gameState.currentPlayerId === IdentityManager.get()) {
                    resetActionArea("Awaiting your next directive...");
                    updateGuide("Your turn. Assess the battlefield.");
                } else {
                    resetActionArea("Waiting for opponent's move...");
                    updateGuide(`It is ${gameState.currentPlayerId}'s turn. Stand by.`);
                }
            }

            // Reset the Idle Nudge Timer every time the game state updates
            manageGuideIdleNudge();

        } catch (e) {
            console.error("Error in updateGameState:", e);
        }
    }

    function renderGrid(containerId, positionsArray, playerKey) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';

        const baseClasses = "w-14 h-14 md:w-16 md:h-16 rounded-xl flex justify-center items-center relative transition-all duration-200 cursor-pointer border shadow-sm";
        const numClasses = "absolute top-1 left-1.5 text-[10px] font-mono opacity-50";

        for (let i = 1; i <= 10; i++) {
            const posData = positionsArray.find(p => p && p.positionId === i);

            let specificClasses = "bg-zinc-950 border-zinc-800 hover:border-zinc-500 hover:bg-zinc-900 hover:-translate-y-0.5";
            let innerHtml = `<span class="${numClasses}">${i}</span>`;

            if (posData) {
                if (posData.capturedByOpponent) {
                    specificClasses = "bg-red-500/5 border-red-500/30 hover:border-red-500/80 hover:-translate-y-0.5";
                    innerHtml += `<span class="font-mono text-xl md:text-2xl font-bold text-red-400 drop-shadow-[0_0_8px_rgba(248,113,113,0.8)]">X</span>`;
                } else if (posData.actor && posData.actor.currentState) {
                    if (posData.actor.currentState === "NOVICE") {
                        specificClasses = "bg-emerald-500/5 border-emerald-500/30 hover:border-emerald-500/80 hover:shadow-[0_0_15px_rgba(16,185,129,0.2)] hover:-translate-y-0.5 hover:scale-[1.02]";
                        innerHtml += `<span class="font-mono text-xl md:text-2xl font-bold text-emerald-400 drop-shadow-[0_0_8px_rgba(52,211,153,0.8)]">N</span>`;
                    } else if (posData.actor.currentState === "FIGHTER") {
                        specificClasses = "bg-amber-500/5 border-amber-500/30 hover:border-amber-500/80 hover:shadow-[0_0_15px_rgba(245,158,11,0.2)] hover:-translate-y-0.5 hover:scale-[1.02]";
                        innerHtml += `<span class="font-mono text-xl md:text-2xl font-bold text-amber-400 drop-shadow-[0_0_8px_rgba(251,191,36,0.8)]">F</span>`;
                    }
                }
            }

            // *** ACTIVE ACTOR HIGHLIGHT ***
            let activeHighlight = "";
            if (globalGameState && globalGameState.state === 'ACTION_REQUIRED' && globalGameState.actionPendingOn === i) {
                const isCurrentPlayerBoard = (playerKey === 'p1' && globalGameState.currentPlayerId === IdentityManager.get()) ||
                    (playerKey === 'p2' && globalGameState.currentPlayerId !== IdentityManager.get());

                if (isCurrentPlayerBoard) {
                    activeHighlight = " ring-4 ring-cyan-400 shadow-[0_0_20px_rgba(34,211,238,0.8)] z-10 scale-[1.05] border-cyan-400 bg-cyan-500/10 ";
                }
            }

            const boxId = `${playerKey}-box-${i}`;
            const onClick = `onclick="handleBoxClick('${playerKey}', ${i})"`;

            container.innerHTML += `<div id="${boxId}" ${onClick} class="${baseClasses} ${specificClasses} ${activeHighlight}">${innerHtml}</div>`;
        }
    }

    // ========================================================
    // TARGETING & CLICK HANDLER LOGIC
    // ========================================================

    function handleBoxClick(gridId, posId) {

        // 1. Wildcard
        if (isWildcardSelecting && gridId === 'p1') {
            const p1 = globalGameState.players.find(p => p.username === IdentityManager.get());
            const pos = p1.positions.find(p => p.positionId === posId);

            if (pos && !pos.capturedByOpponent) {
                isWildcardSelecting = false;
                ws.send(JSON.stringify({ type: "POSITION", payload: { position: posId } }));

                if (globalGameState) {
                    updateGameState(globalGameState);
                }
            }
        }

        // 2. Kamikaze Targeting
        else if (isKamikazeSelecting) {
            if (gridId === 'p1') {
                if (posId === globalGameState.actionPendingOn) {
                    showToast("error", "Cannot Kamikaze the active unit.");
                    return;
                }
                sendActionPayload('KAMIKAZE', null, posId);
            }
            else if (gridId === 'p2') {
                sendActionPayload('KAMIKAZE', posId, null);
            }
        }

        // 3. Attack Targeting
        else if (isAttackSelecting && gridId === 'p2') {
            const p2 = globalGameState.players.find(p => p.username !== IdentityManager.get());
            const pos = p2.positions.find(p => p.positionId === posId);

            if (pos && !pos.capturedByOpponent) {
                sendActionPayload('ATTACK_AND_CAPTURE', posId);
            }
        }
    }

    // ========================================================
    // SERVER-AUTHORITATIVE ROLL ENGINE
    // ========================================================

    function renderRollUI(isMyTurn) {
        const actionArea = document.getElementById('dynamic-action-area');

        let buttonHtml = isMyTurn
            ? `<button id="btn-roll" onclick="requestRollFromServer()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs px-6 py-2.5 rounded-lg transition-colors shadow-sm w-full uppercase tracking-widest">Roll Dice</button>`
            : `<div class="bg-zinc-800 border border-zinc-700 text-zinc-500 font-semibold text-xs px-6 py-2.5 rounded-lg w-full text-center uppercase tracking-widest">Awaiting Opponent</div>`;

        if (isMyTurn) {
            updateGuide("Your turn to roll. Each die features faces 1-5 and a blank. Rolling double blanks unlocks a Wildcard, allowing you to select any of your uncaptured positions.");
        } else {
            updateGuide(`It is ${globalGameState.currentPlayerId}'s turn to roll. Stand by.`);
        }

        actionArea.innerHTML = `
            <h3 class="text-blue-400 font-semibold mb-1 text-sm uppercase tracking-wide">${isMyTurn ? "Your Turn" : "Enemy Turn"}</h3>
            <p class="text-[10px] text-zinc-500 mb-4 uppercase tracking-wider">Roll Phase</p>

            <div class="flex gap-4 mb-4">
                <div id="die-1" class="w-12 h-12 bg-zinc-900 border border-zinc-700 rounded-xl flex justify-center items-center shadow-inner relative"><span class="font-mono text-xl font-bold text-zinc-200">?</span></div>
                <div id="die-2" class="w-12 h-12 bg-zinc-900 border border-zinc-700 rounded-xl flex justify-center items-center shadow-inner relative"><span class="font-mono text-xl font-bold text-zinc-200">?</span></div>
            </div>

            ${buttonHtml}
        `;
    }

    function requestRollFromServer() {
        const btn = document.getElementById('btn-roll');
        if(btn) {
            btn.disabled = true;
            btn.innerText = "REQUESTING...";
        }
        ws.send(JSON.stringify({ type: "POSITION", payload: {} }));
    }

    function handleRollResultFromServer(rollData) {
        const btn = document.getElementById('btn-roll');
        if(btn) btn.innerText = "ROLLING...";

        let v1 = rollData.diceResults[0] === 0 ? '' : String(rollData.diceResults[0]);
        let v2 = rollData.diceResults[1] === 0 ? '' : String(rollData.diceResults[1]);

        if (rollData.isWildcard) {
            v1 = ''; v2 = '';
        }

        executeRollAnimation(v1, v2, rollData.isWildcard);
    }

    function executeRollAnimation(finalVal1, finalVal2, isWildcard) {
        isAnimatingRoll = true;

        // Clear the Nudge Timer so it doesn't trigger while the dice are spinning
        clearTimeout(guideIdleTimer);

        const d1 = document.getElementById('die-1');
        const d2 = document.getElementById('die-2');
        if(!d1 || !d2) {
            isAnimatingRoll = false;
            return;
        }

        const d1Text = d1.querySelector('span');
        const d2Text = d2.querySelector('span');
        const btn = document.getElementById('btn-roll');

        d1.classList.add('rolling');
        d2.classList.add('rolling');

        const faces = ['1', '2', '3', '4', '5', ''];
        let rolls = 0;

        const interval = setInterval(() => {
            d1Text.innerText = faces[Math.floor(Math.random() * faces.length)];
            d2Text.innerText = faces[Math.floor(Math.random() * faces.length)];
            rolls++;

            if(rolls > 25) {
                clearInterval(interval);
                d1.classList.remove('rolling');
                d2.classList.remove('rolling');

                d1Text.innerText = finalVal1;
                d2Text.innerText = finalVal2;

                if (isWildcard && btn) {
                    btn.innerText = "WILDCARD!";
                    btn.classList.replace('bg-blue-600', 'bg-amber-600');
                    btn.classList.replace('hover:bg-blue-500', 'hover:bg-amber-500');
                } else if (btn) {
                    let val1 = finalVal1 === '' ? 0 : parseInt(finalVal1);
                    let val2 = finalVal2 === '' ? 0 : parseInt(finalVal2);
                    let sum = val1 + val2;

                    btn.innerText = "ROLLED: " + sum;
                    btn.classList.replace('bg-blue-600', 'bg-emerald-600');
                    btn.classList.replace('hover:bg-blue-500', 'hover:bg-emerald-500');
                }

                setTimeout(() => {
                    isAnimatingRoll = false;

                    const hadPendingState = (pendingGameState !== null);

                    if (hadPendingState) {
                        globalGameState = pendingGameState;
                        updateGameState(pendingGameState);
                        pendingGameState = null;

                        if (globalGameState.gameplayStatus === 'FINISHED') {
                            showGameOverScreen(globalGameState);
                        }
                    } else {
                        if (globalGameState) {
                            updateGameState(globalGameState);
                        }
                    }

                    const isMyTurnNow = (globalGameState && globalGameState.currentPlayerId === IdentityManager.get());

                    if (isWildcard) {
                        if (isMyTurnNow) triggerWildcardSelection();
                        else resetActionArea("Opponent triggered a WILDCARD. Waiting for selection...");
                    } else {
                        if (!hadPendingState && isMyTurnNow && globalGameState && globalGameState.state === 'ROLL') {
                            resetActionArea("Analyzing target position...");
                        }
                    }

                    // Restart Nudge timer now that the turn/action is ready
                    manageGuideIdleNudge();

                }, 1000);
            }
        }, 50);
    }

    function triggerWildcardSelection() {
        isWildcardSelecting = true;
        updateGuide("DOUBLE BLANKS! You have a wildcard. Click any of your uncaptured positions on your board to select it.");

        const actionArea = document.getElementById('dynamic-action-area');
        actionArea.innerHTML = `
            <h3 class="text-amber-400 font-bold mb-2 text-sm uppercase tracking-widest">Wildcard Active</h3>
            <svg class="w-8 h-8 text-amber-500 mb-2 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path>
            </svg>
            <p class="text-[10px] text-zinc-400">Click a glowing box on your board.</p>
        `;

        const p1 = globalGameState.players.find(p => p.username === IdentityManager.get());
        for(let i=1; i<=10; i++) {

    /**
     * 7. ACTION UI
     */
    function renderActionUI(actorType) {
        const actionArea = document.getElementById('dynamic-action-area');

        let html = `
            <h3 class="text-amber-400 font-semibold mb-2 text-sm uppercase tracking-wide">Tactical Action</h3>
            <p class="text-[11px] text-zinc-400 mb-4">${actorType} selected.</p>
            <div class="grid grid-cols-2 gap-3 w-full px-2">`;

        if (actorType === "NOVICE") {
            updateGuide("Novice Selected: Evolve to a Fighter, or trigger a Kamikaze! 💥 Kamikaze sacrifices your Novice to rewind the target's timeline. Example: A tile went Novice ➔ Fighter ➔ Captured. Kamikaze blasts away 'Captured', reverting it to a Fighter! Hit it again, and the Fighter devolves back to Novice. The state you blow up is gone forever. Great for liberating your captured bases or demoting enemy Fighters. Handle with care! ⚠️");
            html += `
                <button onclick="sendActionPayload('EVOLVE')" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-[11px] px-4 py-2.5 rounded-lg transition-colors shadow-sm w-full uppercase tracking-wider">Evolve</button>
                <button onclick="triggerKamikazeSelection()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-[11px] px-4 py-2.5 rounded-lg transition-colors shadow-sm w-full uppercase tracking-wider">Kamikaze</button>
            `;
        }
        else if (actorType === "FIGHTER") {
            updateGuide("Fighter Selected: Target an uncaptured enemy position to capture it. Initiating an attack grants you an immediate bonus roll.");
            html += `
                <button onclick="triggerAttackSelection()" class="col-span-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-[11px] px-4 py-2.5 rounded-lg transition-colors shadow-sm w-full uppercase tracking-wider">Attack</button>`;
        }
        else {
            updateGuide(`Tactical Action required for your ${actorType}. Choose your strategy carefully.`);
            html += `<span class="col-span-2 text-zinc-500 text-xs">No actions available.</span>`;
        }

        html += `</div>`;
        actionArea.innerHTML = html;
    }

    function triggerKamikazeSelection() {
        isKamikazeSelecting = true;
        isAttackSelecting = false;
        updateGuide("KAMIKAZE active. Click an enemy position (Destination) OR your own position (Source) to strike. You cannot target the active unit.");

        document.getElementById('dynamic-action-area').innerHTML = `
            <h3 class="text-amber-400 font-bold mb-2 text-sm uppercase tracking-widest">Select Target</h3>
            <p class="text-[10px] text-zinc-400">Click a pulsing red box to strike.</p>
            <button onclick="updateGameState(globalGameState)" class="mt-4 text-xs text-zinc-500 hover:text-zinc-300 underline">Cancel</button>
        `;

        for(let i=1; i<=10; i++) {
            const p1Box = document.getElementById(`p1-box-${i}`);
            if (p1Box) {
                if (i !== globalGameState.actionPendingOn) {
                    p1Box.classList.remove('border-zinc-800', 'border-red-500/30', 'border-emerald-500/30', 'border-amber-500/30', 'border-cyan-400');
                    p1Box.classList.add('ring-2', 'ring-red-500/70', 'animate-pulse', 'z-20', 'shadow-[0_0_10px_rgba(239,68,68,0.4)]', 'cursor-crosshair', 'border-red-500');
                } else {
                    p1Box.classList.add('cursor-not-allowed', 'opacity-50');
                }
            }

            const p2Box = document.getElementById(`p2-box-${i}`);
            if(p2Box) {
                p2Box.classList.remove('border-zinc-800', 'border-red-500/30', 'border-emerald-500/30', 'border-amber-500/30', 'border-cyan-400');
                p2Box.classList.add('ring-2', 'ring-red-500/70', 'animate-pulse', 'z-20', 'shadow-[0_0_10px_rgba(239,68,68,0.4)]', 'cursor-crosshair', 'border-red-500');
            }
        }
    }

    function triggerAttackSelection() {
        isAttackSelecting = true;
        isKamikazeSelecting = false;
        updateGuide("ATTACK active. Click an UNCAPTURED enemy position to capture it.");

        document.getElementById('dynamic-action-area').innerHTML = `
            <h3 class="text-amber-400 font-bold mb-2 text-sm uppercase tracking-widest">Select Target</h3>
            <p class="text-[10px] text-zinc-400">Click a pulsing red box on the enemy board.</p>
            <button onclick="updateGameState(globalGameState)" class="mt-4 text-xs text-zinc-500 hover:text-zinc-300 underline">Cancel</button>
        `;

        const p2 = globalGameState.players.find(p => p.username !== IdentityManager.get());
        for(let i=1; i<=10; i++) {
            const p1Box = document.getElementById(`p1-box-${i}`);
            if (p1Box) {
                p1Box.classList.add('cursor-not-allowed', 'opacity-50');
            }

            const p2Box = document.getElementById(`p2-box-${i}`);
            if (p2Box) {
                const pos = p2.positions.find(p => p.positionId === i);
                if (pos && !pos.capturedByOpponent) {
                    p2Box.classList.remove('border-zinc-800', 'border-red-500/30', 'border-emerald-500/30', 'border-amber-500/30', 'border-cyan-400');
                    p2Box.classList.add('ring-2', 'ring-red-500/70', 'animate-pulse', 'z-20', 'shadow-[0_0_10px_rgba(239,68,68,0.4)]', 'cursor-crosshair', 'border-red-500');
                } else {
                    p2Box.classList.add('cursor-not-allowed', 'opacity-50');
                }
            }
        }
    }

    function sendActionPayload(actionType, targetPosId = null, sourcePosId = null) {
        let payload = { gameAction: actionType };

        if (actionType === "ATTACK_AND_CAPTURE") {
            if (!targetPosId) return;
            payload.destinationPosition = targetPosId;
        }

        if (actionType === "KAMIKAZE") {
            if (targetPosId) payload.destinationPosition = targetPosId;
            if (sourcePosId) payload.sourcePosition = sourcePosId;
        }

        if (actionType === "EVOLVE") {
            payload.specialization = "FIGHTER";
        }

        // Wipe flags to prevent accidental double clicks before server resolves
        isKamikazeSelecting = false;
        isAttackSelecting = false;

        ws.send(JSON.stringify({ type: "ACTION", payload: payload }));

        if (globalGameState) {
            updateGameState(globalGameState);
        }
    }

    /**
     * 8. UTIL RENDERERS
     */
    function sendChatMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if(!text) return;

        ws.send(JSON.stringify({ type: "CHAT", payload: { message: text } }));
        appendChatLog("You", text);
        input.value = '';
    }

    function resetActionArea(msg = "Awaiting game state...") {
        document.getElementById('dynamic-action-area').innerHTML = `
            <svg class="w-6 h-6 text-zinc-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke-width="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"></circle>
                <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"></circle>
            </svg>
            <span class="text-xs text-zinc-500 font-medium leading-relaxed">${msg}</span>
        `;
    }

    function showToast(type, text) {
        const container = document.getElementById('toast-container');

        // Enforce max 3 toasts rule
        if (container.children.length >= 3) {
            container.removeChild(container.firstChild);
        }

        let colorClass = "bg-zinc-800 border-zinc-700 text-zinc-200";
        let iconHtml = '';

        if (type === "error") {
            colorClass = "bg-red-950/95 border-red-800 text-red-300";
            iconHtml = `<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`;
        } else if (type === "success") {
            colorClass = "bg-emerald-950/95 border-emerald-800 text-emerald-300";
            iconHtml = `<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
        } else {
            colorClass = "bg-zinc-800/95 border-zinc-700 text-zinc-200";
            iconHtml = `<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
        }

        const toast = document.createElement('div');
        toast.className = `px-4 py-2.5 rounded-lg border shadow-[0_0_20px_rgba(0,0,0,0.5)] text-xs font-medium flex items-center gap-2.5 transition-all duration-300 transform -translate-y-4 opacity-0 ${colorClass}`;

        toast.innerHTML = iconHtml;
        const textNode = document.createElement('span');
        textNode.textContent = text;
        toast.appendChild(textNode);

        container.appendChild(toast);

        // Animate in
        requestAnimationFrame(() => {
            toast.classList.remove('-translate-y-4', 'opacity-0');
        });

        // Remove after 3 seconds
        setTimeout(() => {
            toast.classList.add('opacity-0', '-translate-y-2');
            setTimeout(() => {
                if (container.contains(toast)) {
                    container.removeChild(toast);
                }
            }, 300);
        }, 3000);
    }

    function appendChatLog(sender, text) {
        const container = document.getElementById('chat-messages');
        const isMe = (sender === IdentityManager.get() || sender === "You");
        const senderName = isMe ? "You" : sender;

        const alignClass = isMe ? "self-end items-end" : "self-start items-start";
        const colorClass = isMe ? "text-blue-400" : "text-red-400";
        const bgClass = isMe ? "bg-blue-600 text-white border-blue-500" : "bg-zinc-800/50 border-zinc-700/50 text-zinc-200";
        const radiusClass = isMe ? "rounded-tr-sm" : "rounded-tl-sm";

        const wrapper = document.createElement('div');
        wrapper.className = `flex flex-col gap-1 max-w-[85%] ${alignClass}`;

        const senderSpan = document.createElement('span');
        senderSpan.className = `${colorClass} font-semibold text-[10px] uppercase tracking-wide`;
        senderSpan.textContent = senderName;

        const msgDiv = document.createElement('div');
        msgDiv.className = `px-3 py-2 border rounded-xl ${radiusClass} text-xs shadow-sm ${bgClass} whitespace-pre-wrap break-words`;
        msgDiv.textContent = text;

        wrapper.appendChild(senderSpan);
        wrapper.appendChild(msgDiv);
        container.appendChild(wrapper);

        container.scrollTop = container.scrollHeight;
    }

    function toggleGuide() {
        isGuideEnabled = !isGuideEnabled;
        const btn = document.getElementById('btn-guide');
        const panel = document.getElementById('guide-panel');

        // Immediately clear glow
        btn.classList.remove('ring-4', 'ring-emerald-500', 'shadow-[0_0_15px_rgba(16,185,129,0.8)]', 'animate-pulse');

        if (isGuideEnabled) {
            btn.innerText = "Guide: ON";
            btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs px-3 py-1.5 rounded-md transition-colors shadow-sm ml-2";
            panel.style.display = 'block';
            clearTimeout(guideIdleTimer);
        } else {
            btn.innerText = "Guide: OFF";
            btn.className = "bg-zinc-800 hover:bg-zinc-700 text-zinc-400 border border-zinc-700 font-medium text-xs px-3 py-1.5 rounded-md transition-colors shadow-sm ml-2";
            panel.style.display = 'none';
            // Resume idle checking if it's our turn
            if (globalGameState) manageGuideIdleNudge();
        }
    }

    function updateGuide(text) {
        document.getElementById('guide-text').innerText = text;
    }

    function showGameOverScreen(gameState) {
        document.getElementById('game-over-overlay').classList.remove('hidden');
        const winnerText = gameState.winner ? `Winner: ${gameState.winner}` : "Draw / Disconnected";
        document.getElementById('winner-text').innerText = winnerText;
    }

        }

        // Arbitrary test position: 1. You can adjust this as needed for testing.
